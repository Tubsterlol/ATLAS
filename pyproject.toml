[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.4.0"
description = "Aerospace performance and satellite dynamics simulation framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aerospace*", "analytics*", "simulation*", "api*", "database*", "tui*", "scripts*"]

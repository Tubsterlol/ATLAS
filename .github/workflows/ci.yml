name: ATLAS CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Run tests
        run: |
          pytest -q \
            --cov=aerospace \
            --cov=simulation \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Run linting
        run: |
          ruff check .

      - name: Check formatting
        run: |
          ruff format --check .

      - name: Check package import
        run: |
          python -c "import aerospace; import simulation"
